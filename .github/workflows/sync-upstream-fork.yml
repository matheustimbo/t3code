name: Sync upstream fork

on:
  schedule:
    # Every three hours, so an upstream nightly release is picked up the same day.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-fork
  cancel-in-progress: false

env:
  # How long upstream work may sit unintegrated before this job reports red.
  # Measured from the oldest upstream commit still missing from `fork-main`,
  # not from the age of the sync pull request: that request outlives the
  # conflict it described, so a stale one made every later sync start red.
  MAX_BLOCKED_HOURS: "24"

jobs:
  sync:
    if: github.repository == 'matheustimbo/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout fork integration branch
        uses: actions/checkout@v6
        with:
          ref: fork-main
          fetch-depth: 0
          # A deploy key, not GITHUB_TOKEN. GitHub refuses any push carrying
          # `.github/workflows` changes from the job token, so every upstream
          # release that touched a workflow file stalled this sync until
          # someone ran it by hand. An SSH deploy key is not subject to that,
          # and it reaches only this repository.
          ssh-key: ${{ secrets.FORK_SYNC_SSH_KEY }}

      - id: integrate
        name: Integrate upstream when conflict-free
        shell: bash
        run: |
          set -euo pipefail
          # Read upstream directly. The `main` mirror below is a convenience
          # for humans and for the conflict pull request; the integration must
          # not depend on it having been updated.
          git fetch --no-tags https://github.com/pingdotgg/t3code.git \
            +refs/heads/main:refs/remotes/upstream/main

          # `main` is a pure mirror of upstream; fork work lives on `fork-main`.
          # Force, because a diverged mirror must not stop the integration.
          git push --force origin refs/remotes/upstream/main:refs/heads/main ||
            echo "Mirror push failed; continuing with the integration."

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "fork-main already contains the current upstream main."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "mobile_changed=false" >> "$GITHUB_OUTPUT"
            echo "caught_up=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "caught_up=false" >> "$GITHUB_OUTPUT"

          mobile_changed=false
          if ! git diff --quiet HEAD...upstream/main -- \
            apps/mobile \
            packages/client-runtime \
            packages/contracts \
            packages/shared \
            assets \
            patches \
            pnpm-lock.yaml \
            pnpm-workspace.yaml; then
            mobile_changed=true
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge --no-ff --no-edit -m "chore: sync upstream main" upstream/main; then
            if git push origin HEAD:fork-main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "conflict=false" >> "$GITHUB_OUTPUT"
              echo "mobile_changed=$mobile_changed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A clean merge we cannot land (protection, or a race with a push)
            # becomes a pull request rather than a red job.
            echo "Integration push rejected; opening a pull request instead."
            : > conflicted-files.txt
            git merge --abort || git reset --hard "origin/fork-main"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "mobile_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Record what actually collided before unwinding the merge, so the
          # pull request and the run summary say where a human has to look.
          git diff --name-only --diff-filter=U > conflicted-files.txt || :
          git merge --abort
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "conflict=true" >> "$GITHUB_OUTPUT"
          echo "mobile_changed=false" >> "$GITHUB_OUTPUT"

      - name: Dispatch fork builds
        if: steps.integrate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_CHANGED: ${{ steps.integrate.outputs.mobile_changed }}
        shell: bash
        run: |
          set -euo pipefail
          # The push above already triggers both workflows, because a deploy key
          # push is not the token push that GitHub suppresses. These dispatches
          # are the fallback for the day that key is missing or rotated; the
          # release workflow refuses to publish a commit it already released, so
          # the duplicate run stops at its first job instead of cutting a second
          # version.
          gh workflow run fork-release.yml --repo "$GITHUB_REPOSITORY" --ref fork-main
          if [[ "$MOBILE_CHANGED" == "true" ]]; then
            gh workflow run fork-mobile-builds.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref fork-main \
              -f platform=all
          fi

      - name: Open integration pull request for conflicts
        if: steps.integrate.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "The automated sync from \`pingdotgg/t3code:main\` cannot land on its own."
            echo
            if [[ -s conflicted-files.txt ]]; then
              echo "Conflicting files as of $(date -u '+%Y-%m-%d %H:%M UTC'):"
              echo
              sed 's#^#- `#; s#$#`#' conflicted-files.txt
              echo
            fi
            echo "Resolve locally, preserving the fork-only ticket-title and release behavior:"
            echo
            echo '```sh'
            echo "git fetch origin fork-main main"
            echo "git switch -c sync-upstream origin/fork-main"
            echo "git merge origin/main"
            echo "# resolve, then:"
            echo "git push origin HEAD:fork-main"
            echo '```'
            echo
            echo "No fork release can ship until \`fork-main\` contains upstream again."
          } > sync-pr-body.md

          cat sync-pr-body.md >> "$GITHUB_STEP_SUMMARY"

          existing="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base fork-main \
              --head main \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -n "$existing" ]]; then
            # Refresh the body: the conflict set moves as upstream advances, and a
            # stale list sends whoever picks this up to the wrong files.
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file sync-pr-body.md
            echo "Sync PR #$existing is already open; refreshed its conflict list."
            exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base fork-main \
            --head main \
            --title "chore: sync upstream main" \
            --body-file sync-pr-body.md

      - name: Close a sync pull request that has nothing left to say
        if: steps.integrate.outputs.caught_up == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # `fork-main` contains upstream, so whatever the request described was
          # resolved, here or by hand. Leaving it open ages it into a false alarm.
          existing="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base fork-main \
              --head main \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -n "$existing" ]]; then
            gh pr close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "fork-main now contains upstream main; closing automatically."
          fi

      - name: Escalate a sync that has been blocked too long
        if: steps.integrate.outputs.conflict == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The oldest upstream commit `fork-main` still lacks is how long the
          # fork has actually been stuck. A successful sync empties this range,
          # so anything waiting here arrived after the last clean integration.
          # `tail`, not `--reverse | head`: `head` closes the pipe on its first
          # line, and under `pipefail` that SIGPIPE fails the step. Log order is
          # newest first, so the last line is the oldest commit either way.
          oldest="$(git log --format=%cI HEAD..upstream/main | tail -1)"
          if [[ -z "$oldest" ]]; then
            exit 0
          fi

          hours=$(( ( $(date -u +%s) - $(date -u -d "$oldest" +%s) ) / 3600 ))
          if (( hours >= MAX_BLOCKED_HOURS )); then
            echo "::error::Upstream commits have been waiting ${hours}h to integrate. No fork release carries them; resolve the open sync pull request."
            exit 1
          fi
          echo "Oldest unintegrated upstream commit is ${hours}h old; this job turns red at ${MAX_BLOCKED_HOURS}h."
