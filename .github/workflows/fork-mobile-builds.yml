name: Fork mobile builds

on:
  push:
    branches:
      - fork-main
    paths:
      - apps/mobile/**
      - packages/client-runtime/**
      - packages/contracts/**
      - packages/shared/**
      - assets/**
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/fork-mobile-builds.yml
  workflow_dispatch:
    inputs:
      platform:
        description: Mobile platform to build
        required: true
        type: choice
        default: all
        options:
          - all
          - android
          - ios

permissions:
  contents: read

concurrency:
  group: fork-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VARIANT: production
  MOBILE_VERSION_POLICY: appVersion
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  android:
    name: Android installable APK
    if: >-
      github.repository == 'matheustimbo/t3code' &&
      (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      T3CODE_ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE || 'com.matheustimbo.t3code.fork' }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Generate Android project
        working-directory: apps/mobile
        env:
          EXPO_NO_GIT_STATUS: "1"
        run: pnpm exec expo prebuild --clean --platform android --no-install

      - name: Build signed release APK
        working-directory: apps/mobile/android
        run: ./gradlew app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose "$apk"
          mkdir -p mobile-artifacts
          cp "$apk" mobile-artifacts/t3code-fork-android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: t3code-fork-android
          path: mobile-artifacts/t3code-fork-android.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  ios:
    name: iOS simulator and TestFlight build
    if: >-
      github.repository == 'matheustimbo/t3code' &&
      (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios')
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # No T3CODE_IOS_PERSONAL_TEAM here: the fork signs with a paid team, so the
      # widget target, share extension, push and Sign in with Apple stay enabled.
      T3CODE_IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      T3CODE_IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      # Keep the fork's iOS build connected to the production T3 Connect
      # deployment. These are the public values tracked in .env.example;
      # loadRepoEnv() exposes the Clerk values under Expo's EXPO_PUBLIC_*
      # aliases before app.config.ts is evaluated.
      T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
      T3CODE_CLERK_JWT_TEMPLATE: t3-relay
      T3CODE_RELAY_URL: https://relay.t3.codes
      # TestFlight rejects a build number it has already seen, and app.config.ts
      # sets no ios.buildNumber, so every prebuild would otherwise emit 1.
      IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - id: signing
        name: Check TestFlight configuration
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILES_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILES_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          if [[ -n "$CERTIFICATE_BASE64" && -n "$CERTIFICATE_PASSWORD" && -n "$PROFILES_BASE64" &&
                -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" &&
                -n "$T3CODE_IOS_TEAM_ID" && -n "$T3CODE_IOS_BUNDLE_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## TestFlight upload skipped"
              echo
              echo "The unsigned Simulator build is still produced. To also archive and upload to internal TestFlight, configure repository variables \`IOS_TEAM_ID\` and \`IOS_BUNDLE_ID\`, and secrets \`IOS_DIST_CERT_BASE64\`, \`IOS_DIST_CERT_PASSWORD\`, \`IOS_PROVISIONING_PROFILES_BASE64\`, \`APPLE_API_KEY\`, \`APPLE_API_KEY_ID\` and \`APPLE_API_ISSUER\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # An unset T3CODE_IOS_TEAM_ID is not an error in app.config.ts: it silently
      # falls back to the upstream T3 Tools team, and signing then fails much
      # later with an unrelated-looking message.
      - name: Require an explicit Apple team
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$T3CODE_IOS_TEAM_ID"
          test -n "$T3CODE_IOS_BUNDLE_ID"

      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Verify T3 Connect public configuration
        working-directory: apps/mobile
        env:
          EXPO_NO_GIT_STATUS: "1"
        shell: bash
        run: |
          set -euo pipefail
          config_file="$RUNNER_TEMP/t3code-expo-config.json"
          pnpm exec expo config --json > "$config_file"
          node - "$config_file" <<'NODE'
          const fs = require("node:fs");
          const [configPath] = process.argv.slice(2);
          const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
          const relayUrl = config.extra?.relay?.url;
          const publishableKey = config.extra?.clerk?.publishableKey;
          const jwtTemplate = config.extra?.clerk?.jwtTemplate;
          if (
            relayUrl !== "https://relay.t3.codes" ||
            typeof publishableKey !== "string" ||
            publishableKey.length === 0 ||
            jwtTemplate !== "t3-relay"
          ) {
            throw new Error("T3 Connect public configuration did not resolve in Expo config");
          }
          console.log("T3 Connect public configuration resolved for iOS");
          NODE

      - name: Generate iOS project
        working-directory: apps/mobile
        env:
          EXPO_NO_GIT_STATUS: "1"
        run: pnpm exec expo prebuild --clean --platform ios

      # Belt and braces: the build settings below cover Info.plists that use
      # $(CURRENT_PROJECT_VERSION), and this covers the ones Expo writes as a
      # literal. App and extensions must carry the same CFBundleVersion.
      - name: Stamp the build number
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $IOS_BUILD_NUMBER" "$plist" 2>/dev/null || true
          done < <(find ios -name Info.plist -not -path "*/Pods/*")

      - name: Build iOS Simulator app
        working-directory: apps/mobile
        run: |
          xcodebuild \
            -workspace ios/T3Code.xcworkspace \
            -scheme T3Code \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build
          mkdir -p ../../mobile-artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-simulator/Build/Products/Release-iphonesimulator/T3Code.app \
            ../../mobile-artifacts/t3code-fork-ios-simulator.zip

      # Signing is fully explicit: the distribution certificate plus one App Store
      # profile per target. Xcode's automatic provisioning is deliberately not
      # used -- it signs archives with a *development* identity, which a runner
      # has no certificate for.
      - name: Import signing assets
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILES_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILES_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/ios-signing"
          keychain="$RUNNER_TEMP/t3code-build.keychain-db"
          keychain_password="$(uuidgen)"
          mkdir -p "$signing_dir"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$signing_dir/certificate.p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/certificate.p12" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n '1s/.*"\(.*\)".*/\1/p')"
          test -n "$identity"
          echo "signing identity: $identity"

          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          printf '%s' "$PROFILES_BASE64" | base64 -D > "$signing_dir/profiles.tar.gz"
          tar -xzf "$signing_dir/profiles.tar.gz" -C "$signing_dir"
          for profile in "$signing_dir"/*.mobileprovision; do
            uuid="$(security cms -D -i "$profile" | plutil -extract UUID raw -)"
            cp "$profile" "$profiles_dir/$uuid.mobileprovision"
            echo "installed $(basename "$profile") as $uuid"
          done
          test "$(find "$profiles_dir" -name '*.mobileprovision' | wc -l | tr -d ' ')" -ge 3

          # altool discovers the key by ID in this directory.
          mkdir -p "$HOME/.private_keys"
          printf '%s' "$APPLE_API_KEY" > "$HOME/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Archive and export for the App Store
        if: steps.signing.outputs.enabled == 'true'
        working-directory: apps/mobile
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail

          # Archive unsigned, then let exportArchive sign every target with its
          # own App Store profile. Signing during the archive would need a
          # per-target PROVISIONING_PROFILE_SPECIFIER, which xcodebuild can only
          # set globally -- the app, widget and share extension each need a
          # different profile.
          xcodebuild \
            -workspace ios/T3Code.xcworkspace \
            -scheme T3Code \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/T3Code.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            archive

          archived_app="build/T3Code.xcarchive/Products/Applications/T3Code.app"
          actual_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$archived_app/Info.plist")"
          actual_build_number="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$archived_app/Info.plist")"
          test "$actual_bundle_id" = "$T3CODE_IOS_BUNDLE_ID"
          # A stale build number is only rejected at upload, after the archive.
          test "$actual_build_number" = "$IOS_BUILD_NUMBER"

          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${T3CODE_IOS_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>iPhone Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                <key>${T3CODE_IOS_BUNDLE_ID}</key>
                <string>T3 Code Fork App Store</string>
                <key>${T3CODE_IOS_BUNDLE_ID}.widgets</key>
                <string>T3 Code Fork Widgets App Store</string>
                <key>${T3CODE_IOS_BUNDLE_ID}.sharing</key>
                <string>T3 Code Fork Sharing App Store</string>
              </dict>
              <key>uploadSymbols</key>
              <true/>
              <key>destination</key>
              <string>export</string>
            </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath build/T3Code.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist

          ipa="$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa"
          mkdir -p ../../mobile-artifacts
          cp "$ipa" ../../mobile-artifacts/t3code-fork-ios.ipa

      - name: Upload to internal TestFlight
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="mobile-artifacts/t3code-fork-ios.ipa"

          # Validate first: upload rejections surface here with a usable message
          # instead of as a silent processing failure in App Store Connect.
          xcrun altool --validate-app \
            --file "$ipa" \
            --type ios \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER"

          xcrun altool --upload-app \
            --file "$ipa" \
            --type ios \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER"

          {
            echo "## TestFlight"
            echo
            echo "Uploaded \`$T3CODE_IOS_BUNDLE_ID\` build \`$IOS_BUILD_NUMBER\`."
            echo "It reaches the internal testing group once App Store Connect finishes processing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v7
        with:
          name: t3code-fork-ios-simulator
          path: mobile-artifacts/t3code-fork-ios-simulator.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload App Store IPA
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: t3code-fork-ios
          path: mobile-artifacts/t3code-fork-ios.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
