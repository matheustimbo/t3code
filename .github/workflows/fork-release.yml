name: Fork release

on:
  push:
    branches:
      - fork-main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'matheustimbo/t3code'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - id: version
        name: Resolve fork version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Versions follow the published tags, not GITHUB_RUN_NUMBER. The run
          # number counts cancelled and failed runs, so it skipped numbers, and
          # when two runs overlapped the one that finished last published the
          # *lower* version as `latest` -- which is what pointed every desktop
          # updater at an older build than the one already released.
          refs="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v0.1." \
              --jq '.[] | "\(.object.sha) \(.ref)"'
          )"

          # One release per commit. This workflow fires on the sync's push and
          # again on its dispatch fallback; the `fork-release` concurrency group
          # serialises the two, so the second run finds the tag the first one
          # published and stops here instead of cutting a duplicate version.
          if awk -v sha="$GITHUB_SHA" '$1 == sha { hit = 1 } END { exit !hit }' <<<"$refs"; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_SHA is already released; nothing to publish." |
              tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          latest="$(
            sed 's#.*refs/tags/v0\.1\.##' <<<"$refs" |
              grep -E '^[0-9]+$' | sort -n | tail -1 || true
          )"
          version="0.1.$(( ${latest:-0} + 1 ))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "Publishing fork release $version" >> "$GITHUB_STEP_SUMMARY"

  server:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fork release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...
              - --filter=@t3tools/web...
              - --filter=@t3tools/scripts...

      - name: Build versioned server package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          node scripts/update-release-package-versions.ts "$version"
          vp run --filter t3 build
          node apps/server/scripts/cli.ts pack \
            --app-version "$version" \
            --pack-destination release-server \
            --verbose
          test -f "release-server/t3-${version}.tgz"
          tar -tzf "release-server/t3-${version}.tgz" package/dist/bin.mjs >/dev/null
          test "$(npx --yes --package="$GITHUB_WORKSPACE/release-server/t3-${version}.tgz" t3 --version)" = "t3 v${version}"
          cp "release-server/t3-${version}.tgz" release-server/t3-latest.tgz

      - name: Upload server packages
        uses: actions/upload-artifact@v7
        with:
          name: fork-server
          path: release-server/*.tgz
          if-no-files-found: error
          retention-days: 1

  build_wsl_node_pty:
    name: Build WSL node-pty (linux-x64)
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout fork release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...

      # The Windows app runs its server backend inside WSL. Build node-pty on
      # Linux so users do not need a compiler or network access on first launch.
      - name: Build node-pty linux-x64 prebuild
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
          file wsl-prebuild/pty.node

      - name: Upload node-pty linux-x64 prebuild
        uses: actions/upload-artifact@v7
        with:
          # Keep this outside the fork-* publish pattern. It is an input to the
          # Windows build, not a standalone release asset.
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error
          retention-days: 1

  desktop_mac:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: macos-15
    # Apple has approved prior submissions in as much as 4h40. Give the hook a
    # bounded five-hour polling window, plus 30 minutes for build and packaging
    # before the job-level guard ends the runner.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        # arm64 only: an arm64 build cannot run on an Intel Mac anyway, and a
        # second architecture doubles the exposure to Apple's notary queue,
        # which is where every macOS release failure here has come from.
        include:
          - arch: arm64
            rust_target: aarch64-apple-darwin
    steps:
      - name: Checkout fork release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build fork desktop
        env:
          T3CODE_DESKTOP_DISTRIBUTION_LABEL: Fork
          T3CODE_DESKTOP_UPDATE_REPOSITORY: matheustimbo/t3code
          # Applied only on the signed path below. Changing the bundle identifier
          # breaks Squirrel.Mac's in-place update once; doing it in the same
          # release that switches ad-hoc -> Developer ID keeps that to one break.
          MACOS_APP_ID: ${{ vars.MACOS_APP_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          T3CODE_NOTARIZATION_TIMEOUT_MS: "18000000"
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          # Required: the fork ships no committed .env, so the build cannot fall
          # back to the RP domain encoded in a Clerk publishable key.
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          node scripts/update-release-package-versions.ts "$version"

          args=(
            --platform mac
            --target dmg
            --arch "${{ matrix.arch }}"
            --build-version "$version"
            --verbose
          )

          has_all() {
            for value in "$@"; do
              [[ -n "$value" ]] || return 1
            done
          }

          # Developer ID signing needs the whole credential set. Missing any of
          # it falls back to ad-hoc so a release never fails on configuration.
          if has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" \
            "$APPLE_API_ISSUER" "$APPLE_TEAM_ID" "$MACOS_PROVISIONING_PROFILE" \
            "$MACOS_APP_ID" "$T3CODE_CLERK_PASSKEY_RP_DOMAINS"; then
            export T3CODE_DESKTOP_APP_ID="$MACOS_APP_ID"

            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            export APPLE_API_KEY="$key_path"

            profile_path="$RUNNER_TEMP/t3code.provisionprofile"
            printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
            security cms -D -i "$profile_path" >/dev/null
            export T3CODE_APPLE_TEAM_ID="$APPLE_TEAM_ID"
            export T3CODE_MACOS_PROVISIONING_PROFILE="$profile_path"

            echo "macOS signing enabled for $T3CODE_DESKTOP_APP_ID."
            args+=(--signed)
            echo "FORK_MAC_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "macOS signing disabled (missing Apple credentials); falling back to ad-hoc."
            args+=(--adhoc-sign)
            echo "FORK_MAC_SIGNED=false" >> "$GITHUB_ENV"
          fi

          vp run dist:desktop:artifact "${args[@]}"

          mkdir -p release-mac
          shopt -s nullglob
          for pattern in release/*.dmg release/*.zip release/*.blockmap release/*.yml; do
            for file in $pattern; do
              cp "$file" release-mac/
            done
          done
          test -n "$(find release-mac -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find release-mac -maxdepth 1 -name '*.zip' -print -quit)"
          test -f release-mac/latest-mac.yml

      # Signing failures are easy to miss: an unsigned or unstapled DMG still
      # builds and uploads, and only fails on a user's machine at first launch.
      - name: Verify signed macOS artifacts
        if: env.FORK_MAC_SIGNED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find release-mac -maxdepth 1 -name '*.dmg' -print -quit)"
          zip="$(find release-mac -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$dmg"
          test -n "$zip"

          # The ticket is stapled to the .app before electron-builder creates
          # the DMG and updater ZIP, so verify each extracted app rather than
          # asserting a ticket on either container.
          mount_point="$(mktemp -d)"
          zip_extract="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_point" >/dev/null 2>&1 || true
            rm -rf "$mount_point" "$zip_extract"
          }
          trap cleanup EXIT

          verify_app() {
            local app="$1"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type exec --verbose=2 "$app"
            xcrun stapler validate "$app"
            codesign --display --verbose=4 "$app" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier)='
          }

          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point" >/dev/null
          dmg_app="$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$dmg_app"
          verify_app "$dmg_app"

          ditto -x -k "$zip" "$zip_extract"
          zip_app="$(find "$zip_extract" -name '*.app' -print -quit)"
          test -n "$zip_app"
          verify_app "$zip_app"

          echo "Verified signed, stapled apps from the DMG and updater ZIP for ${{ matrix.arch }}." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload desktop packages
        uses: actions/upload-artifact@v7
        with:
          name: fork-desktop-mac-${{ matrix.arch }}
          path: release-mac/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  desktop_windows:
    name: Build Windows x64 desktop
    needs: [prepare, build_wsl_node_pty]
    if: needs.prepare.outputs.release == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout fork release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # setup-vp's cache contains Linux-shaped entries on Windows. Cache the
      # Windows package store directly instead.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - id: package_cache_path
        name: Resolve Windows package cache path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache Windows packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: fork-windows-release-packages-v1-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - id: resource_monitor_cache
        name: Cache resource monitor
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe
          key: fork-resource-monitor-x86_64-pc-windows-msvc-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Spectre-mitigated MSVC libraries
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Download WSL node-pty prebuild
        uses: actions/download-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild

      - name: Build fork desktop
        shell: bash
        env:
          T3CODE_DESKTOP_DISTRIBUTION_LABEL: Fork
          T3CODE_DESKTOP_UPDATE_REPOSITORY: matheustimbo/t3code
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          node scripts/update-release-package-versions.ts "$version"

          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "$version" \
            --wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node" \
            --verbose

          mkdir -p release-windows
          shopt -s nullglob
          for pattern in release/*.exe release/*.blockmap release/*.yml; do
            for file in $pattern; do
              cp "$file" release-windows/
            done
          done
          test -n "$(find release-windows -maxdepth 1 -name '*.exe' -print -quit)"
          test -f release-windows/latest.yml

      - name: Upload desktop packages
        uses: actions/upload-artifact@v7
        with:
          name: fork-desktop-win-x64
          path: release-windows/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    needs: [prepare, server, desktop_mac, desktop_windows]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: fork-*
          merge-multiple: true
          path: release-assets

      - name: Generate fork release notes
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Skip the tag being published, so re-running this job after the
          # release already exists still produces the real changelog.
          previous_tag="$(
            git tag --list 'v0.1.*' --sort=-version:refname |
              grep -vFx "$RELEASE_TAG" | head -1 || true
          )"
          range="${GITHUB_SHA}"
          if [[ -n "$previous_tag" ]]; then
            range="${previous_tag}..${GITHUB_SHA}"
          fi

          {
            echo "## What's changed"
            git log --no-merges --format='- %s' "$range"
            if [[ -n "$previous_tag" ]]; then
              echo
              echo "**Full Changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous_tag}...${RELEASE_TAG}"
            fi
          } > fork-release-notes.md

      - name: Publish fork release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: T3 Code Fork ${{ needs.prepare.outputs.version }}
          body_path: fork-release-notes.md
          make_latest: true
          files: release-assets/*
          fail_on_unmatched_files: true
